<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOTZET</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0f1115;
    color:white;
    font-family:Arial, sans-serif;
}

.container{
    text-align:center;
}

.logo{
    font-size:64px;
    letter-spacing:10px;
    margin-bottom:20px;
}

.subtitle{
    font-size:20px;
    opacity:0.8;
    margin-bottom:40px;
}

.message{
    font-size:28px;
    margin-bottom:15px;
}

.coming{
    font-size:18px;
    opacity:0.7;
    margin-bottom:35px;
}

/* TEASER BUTTON */

.teaser{
    display:inline-block;
    padding:14px 34px;
    border:1px solid #c9a227;
    border-radius:30px;
    color:#c9a227;
    text-decoration:none;
    font-size:13px;
    letter-spacing:3px;
    font-weight:bold;
    transition:
        background 0.3s ease,
        color 0.3s ease,
        transform 0.3s ease,
        box-shadow 0.3s ease;
}

.teaser:hover{
    background:#c9a227;
    color:#0f1115;
    transform:translateY(-2px);
    box-shadow:0 8px 25px rgba(201,162,39,0.25);
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">VOTZET</div>

    <div class="subtitle">
        THAT'S YOUR WORLD
    </div>

    <div class="message">
        A new world is being built.
    </div>

    <div class="coming">
        Coming soon.
    </div>

    <a
        href="votzet-preview-resized.jpeg"
        class="teaser"
        target="_blank"
        rel="noopener noreferrer"
    >
        TEASER
    </a>

</div>

</body>
</html>
