<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VOTZET</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0f1115;
    color:white;
    font-family:Arial, sans-serif;
}

.container{
    text-align:center;
}

.logo{
    font-size:64px;
    letter-spacing:10px;
    margin-bottom:20px;
}

.subtitle{
    font-size:20px;
    opacity:0.8;
    margin-bottom:40px;
}

.message{
    font-size:28px;
    margin-bottom:15px;
}

.coming{
    font-size:18px;
    opacity:0.7;
    margin-bottom:35px;
}

/* ---------- TEASER BUTTON ---------- */

.teaser{
    display:inline-block;
    padding:14px 34px;
    border:1px solid #c9a227;
    border-radius:30px;
    color:#c9a227;
    background:transparent;
    text-decoration:none;
    font-size:13px;
    letter-spacing:3px;
    font-weight:bold;
    cursor:pointer;
    transition:
        background 0.3s ease,
        color 0.3s ease,
        transform 0.3s ease,
        box-shadow 0.3s ease;
}

.teaser:hover{
    background:#c9a227;
    color:#0f1115;
    transform:translateY(-2px);
    box-shadow:0 8px 25px rgba(201,162,39,0.25);
}


/* ---------- TEASER OVERLAY ---------- */

.teaser-overlay{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    justify-content:center;
    align-items:center;
    background:#000;
    padding:20px;
}

.teaser-overlay.active{
    display:flex;
}

.teaser-image{
    display:block;
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    object-fit:contain;
}


/* ---------- CLOSE BUTTON ---------- */

.close-teaser{
    position:absolute;
    top:20px;
    right:24px;
    width:42px;
    height:42px;
    border:1px solid rgba(255,255,255,0.45);
    border-radius:50%;
    background:rgba(0,0,0,0.45);
    color:white;
    font-size:28px;
    line-height:38px;
    cursor:pointer;
    z-index:1001;
    transition:
        background 0.3s ease,
        border-color 0.3s ease;
}

.close-teaser:hover{
    background:rgba(255,255,255,0.12);
    border-color:white;
}


/* ---------- MOBILE ---------- */

@media (max-width:600px){

    .logo{
        font-size:48px;
        letter-spacing:7px;
    }

    .subtitle{
        font-size:17px;
    }

    .message{
        font-size:23px;
    }

    .coming{
        font-size:16px;
    }

    .teaser{
        padding:13px 30px;
    }

    .teaser-overlay{
        padding:10px;
    }

    .close-teaser{
        top:14px;
        right:14px;
        width:38px;
        height:38px;
        font-size:25px;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="logo">VOTZET</div>

    <div class="subtitle">
        THAT'S YOUR WORLD
    </div>

    <div class="message">
        A new world is being built.
    </div>

    <div class="coming">
        Coming soon.
    </div>

    <button class="teaser" id="teaserButton">
        TEASER
    </button>

</div>


<!-- ---------- TEASER ---------- -->

<div class="teaser-overlay" id="teaserOverlay">

    <button class="close-teaser" id="closeTeaser" aria-label="Close teaser">
        ×
    </button>

    <img
        src="votzet-preview.webp"
        alt="VotZet Teaser"
        class="teaser-image"
    >

</div>


<script>

const teaserButton = document.getElementById("teaserButton");
const teaserOverlay = document.getElementById("teaserOverlay");
const closeTeaser = document.getElementById("closeTeaser");

teaserButton.addEventListener("click", function(){
    teaserOverlay.classList.add("active");
});

closeTeaser.addEventListener("click", function(){
    teaserOverlay.classList.remove("active");
});

teaserOverlay.addEventListener("click", function(event){
    if(event.target === teaserOverlay){
        teaserOverlay.classList.remove("active");
    }
});

</script>

</body>
</html>
