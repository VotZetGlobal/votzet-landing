<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VotZet — That's your world!</title>
    <meta name="description" content="VotZet — That's your world! Discover your world.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: #050505;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        /* ---------- BACKGROUND ---------- */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -2;
            background:
                radial-gradient(
                    circle at 50% 40%,
                    rgba(255, 255, 255, 0.08),
                    transparent 35%
                ),
                #050505;
        }

        .orb {
            position: absolute;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: radial-gradient(
                circle,
                rgba(255, 255, 255, 0.10),
                transparent 68%
            );
            filter: blur(20px);
            animation: float 12s ease-in-out infinite;
        }

        .orb.one {
            top: -180px;
            left: -150px;
        }

        .orb.two {
            right: -180px;
            bottom: -160px;
            animation-delay: -5s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(30px, -25px) scale(1.08);
            }
        }

        /* ---------- HEADER ---------- */

        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
        }

        /* Temporary VotZet emblem.
           We can replace this with the official logo later. */

        .logo {
            width: 42px;
            height: 42px;
            border: 1px solid rgba(255,255,255,0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -2px;
            transform: rotate(-12deg);
            box-shadow:
                0 0 20px rgba(255,255,255,0.08);
        }

        .brand-name {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 3px;
        }

        .menu {
            width: 30px;
            height: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }

        .menu span {
            display: block;
            width: 100%;
            height: 1px;
            background: white;
            opacity: 0.8;
        }

        /* ---------- HERO ---------- */

        main {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 100px 24px 60px;
        }

        .hero {
            max-width: 850px;
            animation: appear 1.5s ease forwards;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .eyebrow {
            font-size: 12px;
            letter-spacing: 5px;
            text-transform: uppercase;
            opacity: 0.55;
            margin-bottom: 28px;
        }

        h1 {
            font-size: clamp(54px, 12vw, 120px);
            line-height: 0.9;
            letter-spacing: -5px;
            font-weight: 700;
            margin-bottom: 28px;
        }

        .slogan {
            font-size: clamp(18px, 3vw, 28px);
            letter-spacing: 2px;
            opacity: 0.82;
            margin-bottom: 50px;
        }

        /* ---------- BUTTON ---------- */

        .explore {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 190px;
            height: 58px;
            padding: 0 34px;
            border: 1px solid rgba(255,255,255,0.65);
            border-radius: 50px;
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 4px;
            transition:
                background 0.3s ease,
                color 0.3s ease,
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .explore:hover {
            background: white;
            color: #050505;
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(255,255,255,0.12);
        }

        .arrow {
            margin-left: 14px;
            font-size: 18px;
            transition: transform 0.3s ease;
        }

        .explore:hover .arrow {
            transform: translateX(5px);
        }

        /* ---------- BOTTOM MESSAGE ---------- */

        .bottom-message {
            position: absolute;
            bottom: 28px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.35;
        }

        /* ---------- RESPONSIVE ---------- */

        @media (max-width: 600px) {

            header {
                padding: 20px 18px;
            }

            .logo {
                width: 36px;
                height: 36px;
                font-size: 17px;
            }

            .brand-name {
                font-size: 15px;
                letter-spacing: 2px;
            }

            .menu {
                width: 25px;
                height: 19px;
            }

            main {
                padding-left: 18px;
                padding-right: 18px;
            }

            h1 {
                letter-spacing: -3px;
            }

            .slogan {
                line-height: 1.5;
                margin-bottom: 40px;
            }

            .explore {
                height: 54px;
                min-width: 175px;
            }

            .bottom-message {
                bottom: 18px;
                font-size: 8px;
                letter-spacing: 2px;
            }
        }
    </style>
</head>

<body>

    <div class="background">
        <div class="orb one"></div>
        <div class="orb two"></div>
    </div>

    <header>

        <a href="#" class="brand">
            <div class="logo">VZ</div>
            <div class="brand-name">VOTZET</div>
        </a>

        <div class="menu" aria-label="Menu">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </header>

    <main>

        <section class="hero">

            <div class="eyebrow">
                Welcome to
            </div>

            <h1>
                VotZet
            </h1>

            <div class="slogan">
                That's your world!
            </div>

            <a href="#explore" class="explore">
                EXPLORE
                <span class="arrow">→</span>
            </a>

        </section>

    </main>

    <div class="bottom-message">
        Discover your world
    </div>

</body>
</html>
